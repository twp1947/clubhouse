<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Video Player</title>
    <style>
        #videoContainer {
            width: 50%;
            height: 70%;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #videoPlayer.half-screen {
            position: fixed;
            width: 50vw; /* Half of the viewport width */
            height: 50vh; /* Half of the viewport height */
            top: 25vh; /* Centered vertically */
            left: 25vw; /* Centered horizontally */
            z-index: 1000;
            background: black;
        }
    </style>
</head>
<body>
    <h1>Video Player</h1>
    <div id="videoContainer">
        <video id="videoPlayer" controls width="600">
            <source src="https://twp1947.github.io/clubhouse/clubhouse2.mp4" type="video/mp4">
            Your browser does not support the video tag.
        </video>
    </div>
    <button onclick="goHalfScreen()">Go Half Screen</button>

    <script>
        function goHalfScreen() {
            const videoElement = document.getElementById('videoPlayer');
            // Add the 'half-screen' class to make the video go half-screen
            videoElement.classList.toggle('half-screen');
        }
    </script>
</body>
</html>
